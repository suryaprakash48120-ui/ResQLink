<html lang="en"><head><meta charset="utf-8">

<title>ResQLink — Emergency Facility Coordination</title>
<style>

.bp{background:#f59e0b;color:#451a03;border-color:#f59e0b}.bh{background:#8b5cf6;color:#fff;border-color:#8b5cf6}

.cxc.amb{color:#fbbf24}

.trkc{background:#fff;border:2px solid #c4b5fd;border-radius:18px;padding:14px;margin-top:12px;animation:pop .5s}

const x=(lbl,c)=>`<div class="st h ${c}" style="min-width:150px"><span class="n">${c==='d'?'✓':'•'}</span><span>${lbl}</span></div>`;
return`<div class="trk">${STEPS.map((n,i)=>`<div class="st ${i<done?'d':i===done?'a':''}"><span class="n">${i<done?'✓':i+1}</span>${n}</div>`).join('')}<div class="st h ${hs}"><span class="n">${hs==='d'?'✓':'🚑'}</span><span>${hs==='d'?'AMBULANCE HANDOFF SENT':'HOSPITAL SENDS AMBULANCE HANDOFF'}<em>HOSPITAL ACTION · AFTER STEP 6</em></span></div>${sent?x('AMBULANCE DISPATCHED','d')+x('AMBULANCE EN ROUTE',k==='ARRIVED'?'d':(k==='EN_ROUTE'||k==='NEAR_DESTINATION')?'w':'o')+x('AMBULANCE ARRIVES',k==='ARRIVED'?'d':k==='NEAR_DESTINATION'?'w':'o'):''}</div>`}
// ---------- direction connector ----------
const latest=l=>l.sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''))[0]||null;
function focusReq(){return myReq()||latest(R.filter(x=>x.status!=='cancelled'&&(!HID||x.hospitalId===HID)))||latest(R.filter(x=>x.status!=='cancelled'))}
function cxKind(r){if(!r)return'idle';if(r.status==='pending')return'req';if(r.status==='declined')return'dec';if(r.status!=='confirmed')return'idle';if(!r.handoffSent)return'conf';return{DISPATCHED:'disp',EN_ROUTE:'enr',NEAR_DESTINATION:'near',ARRIVED:'arr'}[r.ambulanceStatus]||'disp'}
function drawCX(){const e=$('#cx');e.style.display=V==='handoff'?'none':'block';const r=focusReq(),k=cxKind(r),sig=k+(r?r.id:'');if(e._s===sig)return;e._s=sig;
const amb=['disp','enr','near','arr'].includes(k);
const c1=amb?'done rev':{req:'go',conf:'go rev',dec:'go rev bad'}[k]||'',c2={disp:'go vio',enr:'go rev amb',near:'go rev amb fast',arr:'done rev'}[k]||'';
const h1=amb?'l':{req:'r',conf:'l',dec:'l'}[k],h2={disp:'r',enr:'l',near:'l',arr:'l'}[k];
const lb1=amb?'CONFIRMED':{req:'EMERGENCY REQUEST',conf:'FACILITY CONFIRMATION',dec:'REQUEST DECLINED'}[k]||'',lb2={disp:'AMBULANCE DISPATCHED',enr:'AMBULANCE EN ROUTE',near:'NEAR DESTINATION',arr:'ARRIVED'}[k]||'';
const cap={idle:'Waiting for an emergency request…',req:'PATIENT ─────► HOSPITAL · EMERGENCY REQUEST',conf:'HOSPITAL ─────► PATIENT · FACILITY CONFIRMATION',dec:'HOSPITAL ─────► PATIENT · REQUEST DECLINED',disp:'HOSPITAL ─────► AMBULANCE · AMBULANCE DISPATCHED',enr:'AMBULANCE ─────► HOSPITAL · AMBULANCE EN ROUTE',near:'AMBULANCE ─────► HOSPITAL · AMBULANCE NEAR DESTINATION',arr:'✓ AMBULANCE ARRIVED · AMBULANCE ─────► HOSPITAL'}[k];
const cc={disp:'vio',enr:'amb',near:'amb',arr:'rev',conf:'rev',dec:'bad',idle:'idle'}[k]||'';
const nd=(ic,n,on)=>`<div class="nd ${on?'on':''}"><i>${ic}</i>${n}</div>`;
e.innerHTML=`<div class="cxw"><div class="cxb">${nd('🧑','PATIENT',k!=='idle')}<div class="lk2 ${c1}">${h1?`<span class="ah ${h1}"></span>`:''}<div class="ln"></div><small>${lb1}</small></div>${nd('🏥','HOSPITAL',k!=='idle')}<div class="lk2 ${c2}">${h2?`<span class="ah ${h2}"></span>`:''}<div class="ln"></div><small>${lb2}</small></div>${nd('🚑','AMBULANCE',amb)}</div><div class="cxc ${cc}">${cap}</div></div>`}
// ---------- auto-play ----------
let AP=0,APS=-1;
const APST=['ANALYZE','MATCH','RANK','CALL & CONFIRM','REQUEST SENT','HOSPITAL RECEIVES REQUEST','HOSPITAL CONFIRMS','FACILITY CONFIRMED','HOSPITAL SENDS AMBULANCE HANDOFF','AMBULANCE DISPATCHED','AMBULANCE EN ROUTE','AMBULANCE TRACKING','NEAR DESTINATION','AMBULANCE ARRIVED'];
function drawAP(){const e=$('#apb');if(APS<0){e.style.display='none';e.innerHTML='';return}e.style.display='block';const n=APST.length;
e.innerHTML=`<div class="apt">${APS>=n?'✓ AUTO-PLAY COMPLETE — HOSPITAL DISPATCHED · AMBULANCE ARRIVED':'▶ AUTO-PLAY · SIMULATED DATA'}</div><div class="apw">${APST.map((x,i)=>`<span class="apc ${i<APS?'d':i===APS?'a':''} ${i>=8?'h':''}">${i<APS?'✓ ':''}${x}</span>`).join('')}</div>`}
const waitFor=async(f,ms=5000)=>{const t=Date.now();while(!f()&&Date.now()-t<ms)await sleep(120)};
function go(v){if(innerWidth>=1000)split=true;location.hash='#/'+v;route()}
const cur=id=>R.find(x=>x.id===id)||{};
async function autoplay(){
if(AP){AP=0;APS=-1;simStop();drawAP();closeM();route();return}
const tok=AP=Date.now(),live=()=>{if(AP!==tok)throw new Error('stop')},st=async(i,ms)=>{live();APS=i;drawAP();await sleep(ms);live()};
simStop();route();
try{
if(!H.length){await acts.samples();await waitFor(()=>H.length)}
const hs=H.find(h=>h.name==='City Care Hospital')||H[0];if(!hs)throw new Error('No hospital');
if(!(+hs.oxygen>0))await put('hospitals',hs.id,{oxygen:5});
HID=hs.id;LS.s('er_hid',HID);seen=null;
P.myId='';LS.s('er_my','');P.phase='form';P.excl=[];P.err='';P.form={need:'Emergency assessment, oxygen support',location:'VIT Chennai',lat:null,lng:null,res:'Oxygen support',sev:'auto'};
closeM();onData();go('patient');render(1);await sleep(600);
APS=0;drawAP();const pa=analyze();await st(0,700);await st(1,700);await st(2,700);await pa;live();
P.sel=cands().some(c=>c.id===hs.id)?hs.id:((cands()[0]||{}).id||'');render(1);
await st(3,1000);await callConfirm();await waitFor(()=>myReq());live();const id=P.myId;
await st(4,1000);go('hospital');await st(5,1600);
APS=6;drawAP();await sleep(1000);live();await setStatus(id,'confirmed');await waitFor(()=>cur(id).status==='confirmed');live();
go('patient');await st(7,1500);
go('hospital');await st(8,800);await sendHandoff(id);await waitFor(()=>cur(id).handoffSent);APS=9;drawAP();await sleep(2700);live();closeM();
APS=10;drawAP();await simStart(id,8000);await sleep(1200);live();
go('ambulance/'+id);APS=11;drawAP();
await waitFor(()=>['NEAR_DESTINATION','ARRIVED'].includes(cur(id).ambulanceStatus),12000);live();APS=12;drawAP();
await waitFor(()=>cur(id).ambulanceStatus==='ARRIVED',8000);live();APS=13;drawAP();await sleep(2200);live();APS=14;drawAP()}
catch(e){if(e.message!=='stop')toast('Auto-play stopped: '+e.message)}
finally{if(AP===tok)AP=0;route()}}
function render(force){rp('pv',JSON.stringify([P.phase,P.sub,P.sel,P.excl,P.err,P.res,P.sev,P.myId,V,myReq()&&[myReq().status,myReq().confirmedAt,myReq().handoffSent,myReq().ambulanceStatus,myReq().ambulancePaused],P.phase==='ranked'?cands().map(h=>h.id+h[FIELD[P.res]]):0]),pHTML,force);
rp('hv',JSON.stringify([HID,H,R.filter(r=>r.hospitalId===HID).map(sigR),V]),hHTML,force&&0);
rp('av',JSON.stringify([hid_route,sigR(R.find(x=>x.id===hid_route)),V]),aHTML,force&&0);
rp('tv',JSON.stringify([ambId(),sigR(R.find(x=>x.id===ambId())),V]),tHTML,force&&0);drawCX();drawTrack()}
function onData(){const pend=R.filter(r=>r.hospitalId===HID&&r.status==='pending').map(r=>r.id);
if(seen){if(pend.some(i=>!seen.includes(i))){chime();flash();toast('🚨 New emergency request');setTimeout(()=>{$('#hv')._s=null;render()},8500)}}seen=pend;render()}
function route(){const h=location.hash;hid_route='';amb_route='';
if(h.startsWith('#/handoff')){V='handoff';hid_route=decodeURIComponent(h.slice(10))}else if(h.startsWith('#/ambulance')){V='ambulance';amb_route=decodeURIComponent(h.slice(12))}else V=h==='#/hospital'?'hospital':'patient';
const m=$('#app');m.dataset.v=V;m.dataset.split=split&&V!=='handoff'&&V!=='ambulance'?'1':'0';
$('#nav').innerHTML=[['patient','PATIENT'],['hospital','HOSPITAL'],['handoff','AMBULANCE'],['ambulance','TRACKING']].map(([k,n])=>`<button class="${V===k?'on':''}" data-act="v" data-v="${k==='handoff'?'handoff':k}">${n}</button>`).join('')+`<button class="${split?'on':''}" data-act="split">⇄ SPLIT</button><button class="${AP?'on':''}" data-act="auto">${AP?'■ STOP':'▶ AUTO-PLAY'}</button><button data-act="resetdemo">↺ RESET DEMO</button>`;
render()}
addEventListener('hashchange',route);
(async()=>{route();try{if(window.claude)DB=await claude.use('db')}catch(e){}
const m=$('#mode');m.textContent=DB?'● LIVE SYNC':'LOCAL MODE · THIS BROWSER ONLY';m.className='badge '+(DB?'live':'loc');
watch('hospitals',a=>{H=a;onData()});watch('requests',a=>{R=a;onData()})})();
</script></body></html>
